# ==============================================================================
# GPU Time-Slicing Verification Workload
# ==============================================================================
# Purpose: prove that N pods can share ONE physical GPU. Each pod requests
# nvidia.com/gpu: 1, and with gpu_time_slicing_replicas = 4 all four schedule
# onto the same g4dn.xlarge.
#
# This is the assertion that matters:
#   kubectl get pods -l app=gpu-load-test -o wide
# All four pods should show the SAME node in the NODE column. If time slicing
# were off, one would be Running and three Pending.
#
# These containers idle rather than compute, so they hold GPU allocations without
# competing for SM time. Use gpu-test-deployment.yaml when you want actual load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-timeslice-test
  namespace: default
  labels:
    app: gpu-load-test
spec:
  replicas: 4
  selector:
    matchLabels:
      app: gpu-load-test
  template:
    metadata:
      labels:
        app: gpu-load-test
    spec:
      # Matches the taint on the Karpenter GPU NodePool.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      nodeSelector:
        accelerator: nvidia-gpu

      containers:
        - name: cuda-holder
          # -base is enough here: the container only needs to hold a GPU
          # allocation and run nvidia-smi, not compile anything.
          image: nvidia/cuda:12.2.0-base-ubuntu22.04
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== Visible GPU devices ==="
              nvidia-smi -L
              echo "=== Holding allocation; delete this deployment to release ==="
              sleep infinity
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: 100m
              memory: 256Mi
